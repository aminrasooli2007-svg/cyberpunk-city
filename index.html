
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080817">
  <meta name="description" content="Cyberpunk City — A neon-soaked CSS night experience.">
  <title>NEON CITY | Cyberpunk Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="city">
    <div class="sky"></div>
    <div class="moon"></div>
    <div class="stars"></div>
    <div class="sun-glow"></div>
    <div class="horizon-glow"></div>

    <header class="navbar">
      <a href="#" class="logo">
        <span class="logo-icon">N</span>
        NEON<span class="accent">CITY</span>
      </a>

      <nav class="nav-links">
        <a href="#city">Explore</a>
        <a href="#about">About</a>
      </nav>

      <a class="status" href="#city">
        <span class="status-dot"></span>
        SYSTEM ONLINE
      </a>
    </header>

    <section class="hero" id="city">
      <div class="hero-content">
        <p class="eyebrow">
          <span></span>
          WELCOME TO THE FUTURE
        </p>

        <h1>
          NEON<br>
          <span class="outline">AFTER</span>
          <span class="pink">DARK.</span>
        </h1>

        <p class="hero-description">
          A city that never sleeps.<br>
          A future that never fades.
        </p>

        <a href="#about" class="explore-btn">
          EXPLORE THE CITY
          <span>↗</span>
        </a>
      </div>

      <div class="coordinates">
        <span>35°41'22.2"N</span>
        <span>139°41'30.1"E</span>
        <span class="coordinates-label">TOKYO / SECTOR 07</span>
      </div>
    </section>

    <section class="skyline" aria-label="Neon city skyline">
      <div class="building distant b1"></div>
      <div class="building distant b2"></div>
      <div class="building distant b3"></div>
      <div class="building distant b4"></div>
      <div class="building distant b5"></div>

      <div class="building b6">
        <div class="building-label">TOKYO<br>2049</div>
        <div class="windows"></div>
        <div class="antenna"></div>
      </div>

      <div class="building b7">
        <div class="neon-sign sign-blue">未来</div>
        <div class="windows"></div>
      </div>

      <div class="building b8">
        <div class="neon-sign sign-pink">CYBER</div>
        <div class="windows"></div>
        <div class="roof-light"></div>
      </div>

      <div class="building b9">
        <div class="neon-sign sign-purple">NEXUS</div>
        <div class="windows"></div>
      </div>

      <div class="building b10">
        <div class="windows"></div>
        <div class="roof-light"></div>
      </div>

      <div class="building b11">
        <div class="neon-sign sign-blue">未来都市</div>
        <div class="windows"></div>
      </div>

      <div class="building b12">
        <div class="windows"></div>
      </div>

      <div class="building b13">
        <div class="neon-sign sign-pink">OPEN 24/7</div>
        <div class="windows"></div>
      </div>

      <div class="building b14">
        <div class="windows"></div>
      </div>

      <div class="street"></div>
      <div class="street-reflection"></div>
    </section>

    <div class="rain rain-one"></div>
    <div class="rain rain-two"></div>
    <div class="rain rain-three"></div>

    <footer class="footer" id="about">
      <span>NEON CITY © 2049</span>
      <span>DESIGNED IN THE FUTURE</span>
      <a href="#city">BACK TO TOP ↑</a>
    </footer>
  </main>
</body>
</html>
